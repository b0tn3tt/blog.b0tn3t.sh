baseURL = "https://blog.b0tn3t.sh/"
languageCode = "en-us"
title = "b0tn3t.sh"
theme = "PaperMod"
enableRobotsTXT = true
buildDrafts = false

[pagination]
  pagerSize = 10

[taxonomies]
  category = "categories"
  tag = "tags"

# Главная = список постов (JSON нужен для поиска)
[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  defaultTheme = "dark"
  disableThemeToggle = true
  mainSections = ["posts"]
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  hideFooter = false

  # без profileMode / homeInfoParams -> главная сразу показывает посты

  [params.label]
    link = "https://b0tn3t.sh/"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[menu]
  [[menu.main]]
    identifier = "categories"
    name = "Categories"
    url = "/categories/"
    weight = 10
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 20

[markup.highlight]
  noClasses = false
  style = "monokai"

[markup.goldmark.renderer]
  unsafe = true
