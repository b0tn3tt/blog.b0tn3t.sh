baseURL = "https://blog.b0tn3t.sh/"
title = "b0tn3t.sh"
theme = "PaperMod"
enableRobotsTXT = true
buildDrafts = false

# Multilingual: one site per language (UI kept English via i18n/ overrides).
# Russian stays at root (/), English at /en/, Chinese at /zh/.
defaultContentLanguage = "ru"
defaultContentLanguageInSubdir = false

[pagination]
  pagerSize = 10

[taxonomies]
  category = "categories"
  tag = "tags"

# Главная = список постов (JSON нужен для поиска)
[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  images = ["og.png"]
  defaultTheme = "dark"
  disableThemeToggle = true
  disableLangToggle = true       # language is switched from the home buttons, not the header
  mainSections = ["posts"]
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  hideFooter = false

  # без profileMode / homeInfoParams -> главная сразу показывает посты

  [params.label]
    link = "https://b0tn3t.sh/"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[languages]
  [languages.ru]
    languageName = "RU"
    weight = 1
    [languages.ru.menu]
      [[languages.ru.menu.main]]
        identifier = "categories"
        name = "Categories"
        url = "/categories/"
        weight = 10
      [[languages.ru.menu.main]]
        identifier = "search"
        name = "Search"
        url = "/search/"
        weight = 20
  [languages.en]
    languageName = "EN"
    weight = 2
    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "categories"
        name = "Categories"
        url = "/categories/"
        weight = 10
      [[languages.en.menu.main]]
        identifier = "search"
        name = "Search"
        url = "/search/"
        weight = 20
  [languages.'zh-cn']
    languageName = "中文"
    weight = 3
    [languages.'zh-cn'.menu]
      [[languages.'zh-cn'.menu.main]]
        identifier = "categories"
        name = "分类"
        url = "/categories/"
        weight = 10
      [[languages.'zh-cn'.menu.main]]
        identifier = "search"
        name = "搜索"
        url = "/search/"
        weight = 20

[markup.highlight]
  noClasses = false
  style = "monokai"

[markup.goldmark.renderer]
  unsafe = true
