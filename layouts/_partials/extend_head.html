{{- /* Hotwire Turbo Drive — instant, SPA-like page navigation (like zxc.sx).
       zxc.sx loads it via the Hugo module github.com/gohugoio/hugo-mod-jslibs/turbo;
       we pull the same library from a CDN so the .deb-based CI needs no Go toolchain. */ -}}
<script src="https://cdn.jsdelivr.net/npm/@hotwired/turbo@8.0.4/dist/turbo.es2017-umd.min.js" defer></script>
<link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | absURL }}">
<style>
  /* ===== Theme: black / red hacker terminal ===== */
  :root{ --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  :root[data-theme="dark"]{
    --theme:#0a0a0c;        /* near-black page background */
    --entry:#131317;        /* cards / elevated surfaces */
    --primary:#f2f2f4;      /* titles, strong text */
    --secondary:#8a8a93;    /* muted / meta */
    --tertiary:#2a2a31;     /* subtle lines */
    --content:#cdcdd4;      /* body text */
    --code-bg:#131317;      /* inline code */
    --code-block-bg:#060608;/* code blocks */
    --border:#26262c;       /* borders */
    --accent:#ff2b3e;       /* hacker red */
    --accent-soft:rgba(255,43,62,.5);
  }
  html,body{background:var(--theme);}
  /* monospace everywhere — terminal feel */
  body,.post-title,.entry-header h1,.entry-header h2,.post-content h1,.post-content h2,
  .post-content h3,.post-content h4,input,button,textarea{font-family:var(--mono);}
  .post-content{line-height:1.7;}

  /* a post in the list reads as a clickable card (first-entry is borderless by default) */
  .first-entry{
    min-height:auto;
    margin:var(--gap) 0;
    padding:var(--gap);
    background:var(--entry);
    border:1px solid var(--border);
    border-radius:var(--radius);
    transition:border-color .2s ease, transform .2s ease, box-shadow .2s ease;
  }
  .first-entry:hover,.first-entry:focus-within,
  .post-entry:hover,.post-entry:focus-within{
    border-color:var(--accent);
    transform:translateY(-2px);
    box-shadow:0 0 0 1px var(--accent-soft), 0 8px 26px rgb(0 0 0 / 0.55);
  }
  .first-entry .entry-header h1,.first-entry .entry-header h2{font-size:28px;line-height:1.35;}
  /* terminal prompt tick before list titles */
  .first-entry .entry-header h1::before,
  .first-entry .entry-header h2::before,
  .post-entry .entry-header h2::before{content:">";color:var(--accent);margin-right:.4em;}

  /* red accents */
  .post-content a,.post-single a,.toc a{color:var(--accent);}
  .post-content a:hover{text-decoration:underline;text-underline-offset:3px;}
  #menu a:hover span,#menu li a:hover,#menu .active{color:var(--accent);}
  #menu .active::after{background:var(--accent);}
  .logo .logo-dot{color:var(--accent);}
  mark,strong{color:var(--primary);}
  ::selection{background:var(--accent);color:#0a0a0c;}

  /* terminal banner on home (rendered from content/_index.md) */
  .post-content .term-home{margin:var(--gap) 0 calc(var(--gap) * 1.5);}
  .post-content pre.term-banner{color:var(--accent);line-height:1.1;font-size:13px;margin:0 0 .4rem;
    overflow-x:auto;background:none !important;padding:0;border:0;white-space:pre;
    text-shadow:0 0 10px var(--accent-soft);}
  .post-content .term-sub{color:var(--secondary);font-size:13px;margin:.1rem 0 .9rem;}
  .post-content .term-prompt{font-size:15px;margin:.2rem 0 0;color:var(--content);}
  .post-content .term-prompt .tp-user{color:var(--accent);font-weight:700;}
  .post-content .term-prompt .tp-path{color:var(--secondary);}
  .post-content .term-prompt .cursor{display:inline-block;width:.6ch;height:1.05em;vertical-align:text-bottom;
    background:var(--accent);margin-left:.15ch;box-shadow:0 0 8px var(--accent-soft);
    animation:tblink 1.1s steps(1) infinite;}
  @keyframes tblink{50%{opacity:0;}}
  /* home language chooser */
  .post-content .lang-pick{margin:1rem 0 0;display:flex;gap:.5rem;align-items:center;
    flex-wrap:wrap;font-size:14px;}
  .post-content .lang-pick .lp-label{color:var(--secondary);}
  .post-content .lang-pick a{color:var(--content);border:1px solid var(--border);
    border-radius:6px;padding:.14em .7em;text-decoration:none;transition:border-color .2s,color .2s;}
  .post-content .lang-pick a::before{content:"";}
  .post-content .lang-pick a:hover{border-color:var(--accent);color:var(--accent);}

  /* header logo: "blog" -> blog home (subtle dotted underline), "b0tn3t.sh" -> main site.
     PaperMod sets ".logo a{display:flex}", which stacks our parts vertically — keep them inline on one line. */
  .logo .logo-title{display:inline-flex;align-items:baseline;white-space:nowrap;font-size:24px;font-weight:700;}
  .logo .logo-title a{display:inline;font-size:inherit;font-weight:inherit;}
  .logo a.logo-blog{text-decoration:underline dotted;text-decoration-color:var(--tertiary);text-underline-offset:3px;text-decoration-thickness:1px;}
  .logo a.logo-blog:hover{text-decoration-color:var(--accent);}
  .logo .logo-dot{color:var(--accent);}
  details.spoiler{border:1px solid var(--border);border-radius:8px;padding:.2rem 1rem;margin:1rem 0;background:var(--code-bg)}
  details.spoiler>summary{cursor:pointer;font-weight:600;padding:.6rem .2rem;list-style:none}
  details.spoiler>summary::-webkit-details-marker{display:none}
  details.spoiler>summary::before{content:"▸ ";color:var(--secondary)}
  details.spoiler[open]>summary::before{content:"▾ "}
  details.spoiler[open]>summary{border-bottom:1px solid var(--border);margin-bottom:.6rem}

  /* home/list cover: crop to a short banner (object-fit), don't scale the whole image.
     single post page is left untouched. */
  .first-entry .entry-cover img,.post-entry .entry-cover img{
    height:180px;width:100%;object-fit:cover;object-position:top center;}

  /* in-post terminal headings + more red presence */
  .post-content h1::before,.post-content h2::before,
  .post-content h3::before,.post-content h4::before{
    content:"> ";color:var(--accent);font-weight:700;text-shadow:0 0 10px var(--accent-soft);}
  .post-content h2{border-left:3px solid var(--accent);padding-left:.55rem;}
  .post-content h3{border-left:2px solid var(--accent-soft);padding-left:.5rem;}
  .post-content blockquote{border-inline-start:3px solid var(--accent);
    background:var(--code-bg);box-shadow:inset 0 0 0 1px var(--border);}
  .toc summary{color:var(--accent);}
  .toc summary .title{color:var(--content);}
  /* TOC items: normal text, red terminal ">" markers */
  .toc .inner a{color:var(--content);}
  .toc .inner a:hover{color:var(--accent);}
  .toc .inner ul{list-style:none;padding-inline-start:1.3em;margin:0;}
  .toc .inner li{position:relative;}
  .toc .inner li::before{content:">";color:var(--accent);font-weight:700;
    position:absolute;left:-1.15em;}
  .title-accent{text-decoration:underline;text-decoration-color:var(--accent);
    text-decoration-thickness:3px;text-underline-offset:6px;}

  /* decorative animated "code rain" down the page margins (desktop only) */
  .code-rain{position:fixed;top:0;bottom:0;width:210px;overflow:hidden;z-index:0;
    pointer-events:none;opacity:.26;color:var(--accent);font:14px/1.6 var(--mono);
    white-space:pre;user-select:none;
    -webkit-mask-image:linear-gradient(to bottom,transparent,#000 14%,#000 86%,transparent);
            mask-image:linear-gradient(to bottom,transparent,#000 14%,#000 86%,transparent);}
  .code-rain.left{left:0;}
  .code-rain.right{right:0;text-align:right;}
  .code-rain .stream{position:absolute;top:0;left:0;right:0;padding:0 14px;
    animation:coderain 34s linear infinite;}
  .code-rain.right .stream{animation-duration:42s;}
  @keyframes coderain{from{transform:translateY(0);}to{transform:translateY(-50%);}}
  @media (max-width:1300px){.code-rain{display:none;}}
  @media (prefers-reduced-motion:reduce){.code-rain .stream{animation:none;}}

  /* post tags as terminal #chips */
  .post-tags li a{background:var(--entry);border:1px solid var(--border);
    color:var(--secondary);border-radius:6px;transition:border-color .2s,color .2s;}
  .post-tags li a::before{content:"#";color:var(--accent);margin-right:1px;}
  .post-tags li a:hover{border-color:var(--accent);color:var(--primary);}

  /* inline code tinted red; code blocks get a red left edge */
  .post-content :not(pre) > code{color:#ff8a93;background:var(--code-bg);
    border:1px solid var(--border);border-radius:4px;padding:.08em .35em;}
  .post-content pre{border:1px solid var(--border);border-left:3px solid var(--accent);
    border-radius:var(--radius);}

  /* thin red-accent scrollbar */
  html{scrollbar-width:thin;scrollbar-color:var(--tertiary) var(--theme);}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:var(--theme);}
  ::-webkit-scrollbar-thumb{background:var(--tertiary);border-radius:6px;
    border:2px solid var(--theme);}
  ::-webkit-scrollbar-thumb:hover{background:var(--accent);}

  /* footer: red hover on links */
  .footer a:hover{color:var(--accent);}

  /* subtle scroll-reveal for in-post headings (JS adds .reveal-ready / .in-view;
     without JS everything stays visible) */
  body.reveal-ready .post-content h2,
  body.reveal-ready .post-content h3{opacity:0;transform:translateY(14px);
    transition:opacity .5s ease, transform .5s ease;}
  body.reveal-ready .post-content h2.in-view,
  body.reveal-ready .post-content h3.in-view{opacity:1;transform:none;}
  @media (prefers-reduced-motion:reduce){
    body.reveal-ready .post-content h2,
    body.reveal-ready .post-content h3{opacity:1;transform:none;transition:none;}}
</style>
